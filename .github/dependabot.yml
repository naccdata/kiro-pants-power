version: 2
updates:
  # Python dependencies managed by uv (pyproject.toml + uv.lock).
  # Use the native "uv" ecosystem so Dependabot updates uv.lock directly.
  # The "pip" ecosystem does not update uv.lock and can open duplicate PRs.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    # Group routine updates into a single PR to avoid one PR per package.
    # Security updates are still opened individually and promptly.
    groups:
      python-dependencies:
        patterns:
          - "*"

  # Keep GitHub Actions workflows up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
